# Full ShortLink stack: infrastructure + all five services.
#
#   docker compose up --build
#
# Only the gateway (8080) and the Mailpit inbox UI (8025) are meant for you
# to use. Infra ports are published for running a single service from your
# IDE against Docker-hosted infra. The services themselves are NOT published,
# so the gateway is the only way in (that's what makes trusting its
# X-Forwarded-For header safe).
#
# Secrets: JWT_SECRET and VISITOR_HASH_KEY fall back to dev-only values
# below. Override them in a .env file (see .env.example) for anything that
# isn't your laptop.
#
# Host ports: every published port can be moved with an env var (e.g.
# MONGO_HOST_PORT=27018 if MongoDB is already installed locally on 27017).
# Containers always talk to each other on the internal ports.

name: shortlink

x-jwt-env: &jwt-env
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0123456789}
  JWT_ISSUER: shortlink-auth

x-service-defaults: &service-defaults
  restart: unless-stopped
  # The JVM sizes its heap from the container limit (MaxRAMPercentage=75 in
  # the Dockerfile). Without a limit each service would size itself against
  # the whole Docker VM.
  mem_limit: 512m
  build: &service-build
    context: .
    dockerfile: Dockerfile

services:

  # ---------------- Infrastructure ----------------

  mongodb:
    image: mongo:7
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper). Two client listeners:
  # INTERNAL for containers (kafka:29092), EXTERNAL for your host
  # (localhost:9092).
  kafka:
    image: apache/kafka:3.7.1
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    ports:
      - "${ES_HOST_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      # Dev only: no TLS/auth. Production needs xpack security on.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18

  # Catches every email notification-service sends: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  # ---------------- Services ----------------

  url-service:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        SERVICE: url-service
    environment:
      <<: *jwt-env
      MONGODB_URI: mongodb://mongodb:27017/shortlink
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PUBLIC_BASE_URL: http://localhost:8080
      VISITOR_HASH_KEY: ${VISITOR_HASH_KEY:-dev-only-visitor-hash-key-change-me}
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck: &readiness
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT:-8081}/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6

  auth-service:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        SERVICE: auth-service
    environment:
      <<: *jwt-env
      SERVER_PORT: 8083
      MONGODB_URI: mongodb://mongodb:27017/shortlink_auth
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mongodb: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck: *readiness

  analytics-service:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        SERVICE: analytics-service
    environment:
      <<: *jwt-env
      SERVER_PORT: 8082
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      elasticsearch: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck: *readiness

  notification-service:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        SERVICE: notification-service
    environment:
      SERVER_PORT: 8084
      MONGODB_URI: mongodb://mongodb:27017/shortlink_notifications
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      PUBLIC_BASE_URL: http://localhost:8080
    depends_on:
      mongodb: { condition: service_healthy }
      kafka: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck: *readiness

  api-gateway:
    <<: *service-defaults
    build:
      <<: *service-build
      args:
        SERVICE: api-gateway
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      URL_SERVICE_URI: http://url-service:8081
      AUTH_SERVICE_URI: http://auth-service:8083
      ANALYTICS_SERVICE_URI: http://analytics-service:8082
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      redis: { condition: service_healthy }
      url-service: { condition: service_started }
      auth-service: { condition: service_started }
      analytics-service: { condition: service_started }
    healthcheck: *readiness

volumes:
  mongo-data:
  kafka-data:
  es-data:
