server:
  port: 8084

spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/shortlink_notifications}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      # Read the whole user-registered history on first start, so the
      # contact table is complete even if this service came up after
      # users signed up.
      auto-offset-reset: earliest
    producer:
      properties:
        max.block.ms: 3000
    admin:
      operation-timeout: 5s
      close-timeout: 5s
      fail-fast: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # JavaMail's defaults are infinite timeouts: one hung SMTP server
      # would freeze the listener thread forever.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  kafka:
    user-registered-topic: user-registered
    milestones-topic: link-milestones
    partitions: 3
    replicas: 1
    retry-max-elapsed: 2m
  mail:
    from: ${MAIL_FROM:ShortLink <no-reply@shortlink.local>}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,mongo

logging:
  level:
    org.apache.kafka.clients.NetworkClient: ERROR
