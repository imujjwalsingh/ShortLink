<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shorten links and see who clicks them." />
    <title>ShortLink</title>
    <script>
      // Apply a saved theme before first paint, so someone who picked dark
      // mode doesn't see a flash of the light theme on every load.
      try {
        var theme = localStorage.getItem('shortlink.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
